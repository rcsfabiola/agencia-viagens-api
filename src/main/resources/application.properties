spring.application.name=agencia-viagens-api

# Conexao com o banco de dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/agencia_viagens
spring.datasource.username=agencia_user
spring.datasource.password=agencia_pass

# Comportamento do Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true